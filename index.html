<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Pump Controller Setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* INCYT app palette (incyt-monorepo libs/theme): HighlightBlue accent, DarkBlueGrey header, Poppins.
     Text and borders are pushed darker than the app's defaults so the page reads outdoors in sun. */
  :root {
    --bg: #E4E8EC;
    --card: #FFFFFF;
    --field: #F7F9FA;
    --field-line: #8D969F;
    --ink: #16191C;
    --muted: #4F5861;
    --line: #C3CAD1;
    --grid: #E6EAEE;
    --topbar: #2A323C;                    /* DarkBlueGrey */
    --accent: #04A1FF;                    /* HighlightBlue */
    --accent-btn: #0079C8;                /* darker blue so white button text passes contrast */
    --accent-text: #005385;               /* Secondary700 */
    --accent-soft: #E3F3FF;
    --accent-ink: #FFFFFF;
    --good: #117A40; --good-mark: #1FA35A; --good-bg: #E4F4EA;
    --bad: #B71515; --bad-line: #E04242; --bad-bg: #FCEBEB;
    --warn: #8A4B00; --warn-line: #FD9434; --warn-bg: #FFF3E3;
    --focus: #04A1FF;
    --shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 2px 8px rgba(16, 24, 40, .06);
    --sans: Poppins, "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: var(--sans);                  /* the app has no mono face; digits line up via tabular-nums */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B2027; --card: #2A323C; --field: #222930; --field-line: #6B7682; --ink: #F3F4F5; --muted: #B9C0C7; --line: #48525E; --grid: #36404B;
      --topbar: #12161B; --accent-btn: #0B8FE3; --accent-text: #75CBFF; --accent-soft: rgba(4, 161, 255, .16);
      --good: #57E799; --good-mark: #2FBF71; --good-bg: #1F3A2D; --bad: #FF9B9B; --bad-line: #ED9191; --bad-bg: #3D2326;
      --warn: #FDBA74; --warn-line: #FD9F49; --warn-bg: #3A2D1C; --focus: #75CBFF; --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B2027; --card: #2A323C; --field: #222930; --field-line: #6B7682; --ink: #F3F4F5; --muted: #B9C0C7; --line: #48525E; --grid: #36404B;
    --topbar: #12161B; --accent-btn: #0B8FE3; --accent-text: #75CBFF; --accent-soft: rgba(4, 161, 255, .16);
    --good: #57E799; --good-mark: #2FBF71; --good-bg: #1F3A2D; --bad: #FF9B9B; --bad-line: #ED9191; --bad-bg: #3D2326;
    --warn: #FDBA74; --warn-line: #FD9F49; --warn-bg: #3A2D1C; --focus: #75CBFF; --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; color: inherit; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* header: always the app's dark bar, so the blue logo pops in both themes */
  .top { background: var(--topbar); border-bottom: 3px solid var(--accent); }
  .top .in { max-width: 560px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .top img { display: block; height: 22px; width: auto; }
  .top .app { margin: 0; padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, .25); font-size: 15px; font-weight: 600; color: #FFFFFF; line-height: 1.2; }
  .top .out { margin-left: auto; padding: 8px 0; border: 0; background: none; color: #75CBFF; font-size: 13px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; }
  .top .env { font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: #FD9F49; color: #1B2027; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 0; }

  /* stepper: numbered dots joined by a line; done = tick, current = ring */
  .steps { display: flex; margin: 0 0 22px; }
  .steps button { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 500; }
  .steps button::before { content: ""; position: absolute; z-index: 0; top: 15px; right: 50%; width: 100%; height: 3px; background: var(--line); }
  .steps button:first-child::before { display: none; }
  .steps button.on::before { background: var(--accent); }
  .steps .dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--card); color: var(--muted); font-size: 14px; font-weight: 700; }
  .steps .dot svg { display: none; width: 16px; height: 16px; }
  .steps .done .dot { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .steps .done .dot .n { display: none; }
  .steps .done .dot svg { display: block; }
  .steps .now { color: var(--ink); font-weight: 700; }
  .steps .now .dot { border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 4px var(--accent-soft); }
  .steps button:disabled { cursor: default; }

  /* screen heading */
  .head { margin-bottom: 16px; }
  .head .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
  .head h2 { font-size: 23px; font-weight: 700; line-height: 1.25; margin: 2px 0 6px; text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); font-size: 15px; }

  /* which pump this install is for, on every step after the first */
  .ctx { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .ctx .t { flex: 1; min-width: 0; }
  .ctx b { display: block; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx span { display: block; font-size: 13px; color: var(--muted); }
  .link { border: 0; background: none; padding: 8px 0; color: var(--accent-text); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* section titles inside a step */
  .sec { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; font-size: 16px; font-weight: 700; }
  .head + .sec { margin-top: 0; }
  .sec .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 700; flex: 0 0 auto; }
  .sec.ok .num { background: var(--good-mark); color: #FFFFFF; }

  /* buttons */
  .btn { display: block; width: 100%; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-align: left; font-size: 16px; font-weight: 500; box-shadow: var(--shadow); }
  .btn + .btn { margin-top: 10px; }
  .btn.primary, .btn.back { text-align: center; font-size: 15px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; line-height: 1.15; min-height: 52px; }
  .btn.primary { background: var(--accent-btn); color: var(--accent-ink); border-color: var(--accent-btn); }
  .btn.primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn.back { color: var(--ink); border-color: var(--field-line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  /* choice cards: radio dot on the left, blue fill when chosen */
  .choice { display: flex; align-items: center; gap: 14px; }
  .choice .rad { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--field-line); flex: 0 0 auto; display: grid; place-items: center; }
  .choice .ct { flex: 1; min-width: 0; }
  .choice .tt { display: block; font-weight: 600; }
  .choice .meta { display: block; font-size: 13px; color: var(--muted); }
  .choice:hover { border-color: var(--accent); }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice.sel .rad { border-color: var(--accent); }
  .choice.sel .rad::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  /* action bar stays on screen while the step scrolls */
  .nav { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; margin: 24px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
  .nav .btn { margin: 0; }
  .nav .back { flex: 0 0 auto; width: auto; padding-inline: 20px; }
  .nav { flex-wrap: wrap; }
  .nav .primary { flex: 1 1 0; width: auto; min-width: 0; }
  .nav .saved { flex: 1 0 100%; margin: -2px 0 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .nav .saved:empty { display: none; }

  /* forms */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .txt { display: block; width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 8px; border: 1.5px solid var(--field-line); background: var(--field); color: var(--ink); }
  .txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* messages: tinted box with a strong left edge */
  .msg { border: 1px solid; border-left-width: 5px; border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; color: var(--ink); }
  .msg.ok { background: var(--good-bg); border-color: var(--good-mark); }
  .msg.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .msg.err { background: var(--bad-bg); border-color: var(--bad-line); }
  .msg b { font-weight: 700; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }

  /* run profile chart */
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px 4px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .chart svg { display: block; width: 100%; height: auto; font-family: var(--mono); }
  .chart .band { fill: var(--grid); }
  .chart .sepl { stroke: var(--line); stroke-width: 1; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .lim { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .area { fill: var(--accent); opacity: .16; }
  .chart .trace { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .chart text { fill: var(--muted); font-size: 9px; }
  .chart text.ph { fill: var(--ink); font-weight: 600; font-family: var(--sans); font-size: 10px; }
  .chart text.v { fill: var(--ink); font-weight: 600; }
  .chart text.limlab { text-anchor: end; }
  .tip { font-size: 14px; color: var(--muted); margin: 0 0 14px; }

  /* customer requirement cards */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .q .title { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .q .info { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1.5px solid var(--field-line); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1; flex: 0 0 auto; }
  .q .info[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .q .hint { font-size: 14px; color: var(--muted); background: var(--field); border-radius: 6px; padding: 8px 10px; margin: -2px 0 12px; }
  .q .fields { display: flex; gap: 12px; flex-wrap: wrap; }
  .q .f { flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; }
  .q .f label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .q .ctl { display: flex; gap: 8px; align-items: center; flex: 1; } /* flex:1 so a 44px box centres beside a 132px drum */
  .q input { flex: 1; min-width: 0; width: 100%; font: inherit; font-family: var(--mono); font-size: 18px; font-weight: 500; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--field-line); background: var(--field); color: var(--ink); }
  .q input::placeholder { color: var(--muted); opacity: .7; font-weight: 400; }
  .q input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .q .unit { font-family: var(--mono); color: var(--muted); font-size: 13px; font-weight: 600; }
  /* touch time picker: a snapping drum, middle row is the value */
  .q .drum { position: relative; flex: 1; min-width: 0; height: 132px; border: 1.5px solid var(--field-line); border-radius: 8px; background: var(--field); overflow: hidden; }
  .q .drum::after { content: ""; position: absolute; left: 6px; right: 6px; top: 44px; height: 44px; border: 2px solid var(--accent); border-radius: 6px; background: var(--accent-soft); pointer-events: none; mix-blend-mode: multiply; }
  .q .drum .list { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
  .q .drum .list::-webkit-scrollbar { display: none; }
  .q .drum .pad { height: 44px; }
  .q .drum .opt { height: 44px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 18px; color: var(--muted); }
  .q .drum .opt.sel { color: var(--ink); font-weight: 700; font-size: 20px; }
  .q .drum .edit { position: absolute; inset: 0; width: 100%; height: 100%; border: 2px solid var(--accent); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; font-family: var(--mono); font-size: 20px; text-align: center; z-index: 2; }
  .q .same { font-size: 14px; color: var(--muted); align-self: center; }

  /* panel step: progress, then one card per menu; ticked menus fold to one line */
  .prog { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .prog .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 15px; }
  .prog b { font-size: 17px; }
  .bar { height: 10px; border-radius: 5px; background: var(--grid); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good-mark); border-radius: 5px; }
  .grp { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .grp:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .grp input { width: 28px; height: 28px; margin: 0; flex: 0 0 auto; accent-color: var(--good-mark); cursor: pointer; }
  .grp .body { flex: 1; min-width: 0; }
  .grp .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grp .path { font-size: 17px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .grp .path b { color: var(--accent-text); font-weight: 700; }
  .grp .sep { color: var(--muted); font-weight: 400; padding: 0 4px; }
  .grp .it { display: flex; gap: 10px; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--grid); font-size: 15px; }
  .grp .it:first-of-type { border-top: 0; }
  .grp .set { min-width: 0; }
  .grp .sub { color: var(--muted); }
  .grp .val { font-family: var(--mono); font-weight: 700; text-align: right; white-space: nowrap; }
  .grp .val.leave { color: var(--muted); font-weight: 400; font-style: italic; }
  .grp .note { font-size: 14px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .grp.done { background: var(--good-bg); border-color: var(--good-mark); box-shadow: none; padding-block: 10px; }
  .grp.done .eyebrow { color: var(--good); }
  .grp.done .path { margin: 0; font-size: 15px; }
  .grp.done .it, .grp.done .note { display: none; }

  /* send step */
  .todo { list-style: none; margin: 0 0 14px; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .todo > li { display: flex; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--grid); }
  .todo > li:first-child { border-top: 0; }
  .todo .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; font-weight: 700; font-size: 15px; background: var(--accent-soft); color: var(--accent-text); }
  .todo .ic.warn { background: var(--warn-bg); color: var(--warn); border: 1.5px solid var(--warn-line); }
  .todo .ic svg { width: 16px; height: 16px; }
  .todo > li > div > b { display: block; font-weight: 700; }
  .todo .d b { font-weight: 700; }
  .todo .d { display: block; font-size: 14px; color: var(--muted); }
  .todo ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
  details.preview { margin-bottom: 14px; }
  details.preview summary { cursor: pointer; font-weight: 600; color: var(--accent-text); padding: 6px 0; }
  pre.sum { white-space: pre-wrap; font-family: var(--mono); font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 8px 0 0; overflow-x: auto; }
  .sent { text-align: center; padding: 28px 18px; }
  .sent .big { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: var(--good-mark); color: #FFFFFF; }
  .sent .big svg { width: 34px; height: 34px; }
  .sent h3 { font-size: 22px; margin: 0 0 6px; }
  @media (prefers-reduced-motion: no-preference) { .grp, .btn, .choice { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>

<header class="top"><div class="in">
  <img src="incyt-logo.webp" alt="INCYT" width="2143" height="566">
  <h1 id="title" class="app">Pump Controller Setup</h1>
  <button type="button" class="out" id="signout" hidden>Sign out</button>
</div></header>

<div class="wrap">
  <div class="steps" id="steps">
    <button type="button" class="on now" data-step="0"><span class="dot"><span class="n">1</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Pump</button>
    <button type="button" data-step="1"><span class="dot"><span class="n">2</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Customer</button>
    <button type="button" data-step="2"><span class="dot"><span class="n">3</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Panel</button>
    <button type="button" data-step="3"><span class="dot"><span class="n">4</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Send</button>
  </div>
  <div id="screen"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
<script>
(function () {
  // ---- The INCYT platform this page talks to. Add ?env=dev to the URL to use the dev platform.
  // Same Cognito pools and client ids as the INCYT dashboard (incyt-monorepo apps/dashboard environments).
  var ENVS = {
    prod: { api: "https://api.incyt.io/api/trpc/v11", pool: "us-east-1_iIjj0EllY", client: "7o0du1nk4t8f2f78174njv3e2t" },
    dev: { api: "https://devapi.incyt.co/api/trpc/v11", pool: "us-east-1_BLgWyWnwO", client: "35312dhro63jeqs1prkl7g6cv9" }
  };
  var ENV_NAME = /[?&]env=dev(&|$)/.test(location.search) ? "dev" : "prod";
  var ENV = ENVS[ENV_NAME];
  var APP_TYPE = "AP-A-0058"; // Engine Monitoring & Control
  // Roles that may write notes and change app settings (client-api allowEditor / allowContributorAbove).
  var EDIT_ROLES = ["OWNER", "ADMIN", "CONTRIBUTOR", "INSTALLER"];
  // First line of the notes this page writes. Drafts are replaced, never kept: one at a time, all removed on send.
  var DRAFT_HEAD = "Pump controller setup in progress";
  var FINAL_HEAD = "Pump controller setup complete";

  // Engine model = the app's engineModel setting. Both Kensho builds use the same panel menus.
  var MODELS = {
    "kensho-k27-k37": { ctrl: "kensho", name: "Kensho K27 / K37, electronic engine" },
    "kensho-mechanical-k27-k37": { ctrl: "kensho", name: "Kensho K27 / K37, mechanical engine" },
    "murphy-tec10": { ctrl: "murphy", name: "Murphy TEC-10" }
  };

  // ---- Sign-in: Cognito, the same way the dashboard does it. The library keeps the session in localStorage.
  var CI = window.AmazonCognitoIdentity;
  var pool = CI ? new CI.CognitoUserPool({ UserPoolId: ENV.pool, ClientId: ENV.client }) : null;
  var me = null; // { name, email } once signed in

  function token() {
    return new Promise(function (ok, no) {
      var u = pool && pool.getCurrentUser();
      if (!u) return no(new Error("Signed out"));
      u.getSession(function (err, s) {
        if (err || !s || !s.isValid()) return no(err || new Error("Signed out"));
        ok(s.getIdToken().getJwtToken());
      });
    });
  }
  function signIn(email, password) {
    return new Promise(function (ok, no) {
      var u = new CI.CognitoUser({ Username: email, Pool: pool });
      u.authenticateUser(new CI.AuthenticationDetails({ Username: email, Password: password }), {
        onSuccess: ok,
        onFailure: no,
        newPasswordRequired: function () { no(new Error("This account needs a new password. Sign in to the INCYT app once to set it, then come back.")); }
      });
    });
  }

  // ---- client-api is tRPC with superjson: inputs go inside {json}, Dates are listed in meta.
  function rpc(path, input, mutate) {
    return token().then(function (t) {
      var url = ENV.api + "/" + path, opt = { headers: { authorization: t } };
      if (mutate) {
        var json = {}, dates = {};
        Object.keys(input).forEach(function (k) {
          if (input[k] instanceof Date) { json[k] = input[k].toISOString(); dates[k] = ["Date"]; } else json[k] = input[k];
        });
        opt.method = "POST";
        opt.headers["content-type"] = "application/json";
        opt.body = JSON.stringify(Object.keys(dates).length ? { json: json, meta: { values: dates } } : { json: json });
      } else if (input !== undefined) {
        url += "?input=" + encodeURIComponent(JSON.stringify({ json: input }));
      }
      return fetch(url, opt).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          if (!r.ok || !j || j.error) throw new Error((j && j.error && j.error.json && j.error.json.message) || "INCYT replied with an error (" + r.status + ").");
          return j.result.data.json;
        });
      });
    });
  }

  // ---- Customer requirements: how the engine should run. Blank = leave the panel as it is.
  // unit "rpm" or "time". Times are typed as m:ss or minutes and stored as seconds.
  // info: one plain line behind the "i" button, for installers who have not met the phase before.
  var INFO = {
    warm: "After starting, the engine runs gently for a short time so oil and coolant warm up before it takes load.",
    fill: "A low speed that fills the pipeline with water before full pumping, so the pump is not driven hard against an empty line.",
    run: "The normal pumping speed once the line is full. INCYT can ask for a different speed within the range below.",
    cool: "Before stopping, the engine drops back to a low speed for a short time so it cools gradually instead of shutting off hot.",
    lim: "The lowest and highest speeds INCYT is allowed to ask for remotely. The engine will never be driven outside this range."
  };
  var REQS = {
    kensho: [
      { id: "warm", title: "Warm up", fields: [ { id: "warmTime", label: "How long", unit: "time", typical: "1:30" }, { id: "idle", label: "Idle speed", unit: "rpm", typical: "800" } ] },
      { id: "fill", title: "Line fill", fields: [ { id: "fillTime", label: "How long", unit: "time", typical: "1:30" }, { id: "fillSpeed", label: "Speed", unit: "rpm", typical: "825" } ] },
      { id: "run", title: "Run", fields: [ { id: "run", label: "Speed", unit: "rpm", typical: "850" } ] },
      { id: "cool", title: "Cool down", fields: [ { id: "coolTime", label: "How long", unit: "time", typical: "2:00" } ], same: "at idle speed" },
      { id: "lim", title: "Range INCYT may request", fields: [ { id: "min", label: "Lowest", unit: "rpm", typical: "1000" }, { id: "max", label: "Highest", unit: "rpm", typical: "1800" } ] }
    ],
    murphy: [
      { id: "warm", title: "Warm up", fields: [ { id: "warmTime", label: "How long", unit: "time", typical: "1:30" }, { id: "warmSpeed", label: "Speed", unit: "rpm", typical: "800" } ] },
      { id: "run", title: "Run", fields: [ { id: "run", label: "Speed", unit: "rpm", typical: "900" } ] },
      { id: "cool", title: "Cool down", fields: [ { id: "coolTime", label: "How long", unit: "time", typical: "2:00" }, { id: "coolSpeed", label: "Speed", unit: "rpm", typical: "800" } ] },
      { id: "lim", title: "Range INCYT may request", fields: [ { id: "min", label: "Lowest", unit: "rpm", typical: "800" }, { id: "max", label: "Highest", unit: "rpm", typical: "1600" } ] }
    ]
  };

  // ---- Panel menus, in panel order. One tick per menu.
  // item: [setting, value] | [setting, value, subpath] | { f, set, fmt, sub? }
  var CONTROLLERS = {
    kensho: {
      name: "Kensho K27 / K37",
      menus: [
        { path: ["Set Timers"], items: [
          ["Set Stop Timer", "Disabled"], ["Delay Btw Starts", "Disabled"],
          ["Function Enable", "Disabled", "Set 7 Day Timer"], ["Purge Timer", "Disabled", "Purge Timers"]
        ]},
        { path: ["User Settings", "Engine"], items: [
          { f: "run", set: "Engine Run Speed", fmt: "rpm" },
          { f: "warmTime", set: "Warm Up Time", fmt: "mss" },
          { f: "coolTime", set: "Cool Down Time", fmt: "mss" }
        ]},
        { path: ["User Settings", "Throttle"], items: [
          ["Throttle Type", "Modbus Control"],
          { f: "idle", set: "Engine Idle", fmt: "rpm" },
          { f: "fillSpeed", set: "Line Fill Speed", fmt: "rpm" },
          { f: "fillTime", set: "Line Fill Time", fmt: "mss" },
          { f: "max", set: "MaxRPM @ Variable", fmt: "rpm" },
          { f: "min", set: "MinRPM @ Variable", fmt: "rpm" },
          ["RampRate RPM/Sec", "10"]
        ]},
        { path: ["User Settings", "4-20mA Sensor"], note: "Protection shutdowns can stay. Anything that changes engine speed on its own must be off.", items: [
          ["Sender Function", "Disabled", "Flow Sensor"],
          ["Sender Function", "Disabled", "Pressure Sensor"]
        ]},
        { path: ["User Settings", "Suction 4-20mA"], items: [ ["Sender Function", "Disabled"] ] },
        { path: ["User Settings", "Dam Level"], items: [ ["Sender Function", "Disabled"] ] },
        { path: ["User Settings", "Start Type"], items: [ ["Set Start Type", "Momentary"], ["Input Type", "Start NO Stop NO"], ["Force Auto", "Enabled"] ] },
        { path: ["User Settings", "Modbus"], items: [ ["Modbus Channel", "RS232 (GSM Disable)"], ["Slave Address", "10"], ["Baudrate", "38400"] ] },
        { path: ["User Settings", "GSM"], items: [ ["Active", "Disabled"] ] }
      ]
    },
    murphy: {
      name: "Murphy TEC-10",
      menus: [
        { path: ["System"], items: [ ["Standby Timer", "0"] ] },
        { path: ["User Settings"], note: "Running Loaded Speed is shown in Speed Settings but is changed under Application Configuration. The same speed values also appear under Engine Settings.", items: [
          ["Speed Source", "J1939", "Speed Settings"],
          { f: "warmSpeed", set: "Warm Up Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "warmTime", set: "Warm Up Delay", fmt: "mss", sub: "Speed Settings" },
          { f: "coolSpeed", set: "Cooldown Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "coolTime", set: "Cooldown Delay", fmt: "min", sub: "Speed Settings" },
          ["Warmup Manual Mode", "Enabled", "Speed Settings"],
          ["Cooldown Manual Mode", "Enabled", "Speed Settings"],
          { f: "min", set: "Minimum Engine Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "max", set: "Maximum Engine Speed", fmt: "rpm", sub: "Speed Settings" },
          ["Auto Throttle Method", "Running Loaded"],
          ["Function", "Disabled", "Analog Input 3"]
        ]},
        { path: ["Advanced Engine Settings"], items: [ ["Address Claim", "3"] ] },
        { path: ["Input/Output", "Relay & Digital Outputs"], items: [ ["DO2 (B+, 1A)", "Ignition On"] ], note: "Not highlighted on the config sheet; included because TEC-10 pin 24 is wired to the Senquip." },
        { path: ["Application Configuration"], items: [ { f: "run", set: "Running Loaded Speed", fmt: "rpm" } ] },
        { path: ["Communication"], items: [ ["Communication Type", "Modbus"], ["Slave Address", "3"], ["Baudrate", "38400"], ["Stopbits", "1"], ["Parity", "None"] ] }
      ]
    }
  };

  var KEY = "pcs-state-v5-" + ENV_NAME;
  // Desktop = a real pointer that can hover (mouse or trackpad). Phones and tablets fall through to typing.
  var DESKTOP = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
  var state = load() || fresh();

  // model: the app's engineModel; ctrl: which panel (kensho | murphy). draftFrom: who saved the requirements we picked up.
  // savedDraft: body of the draft note we last wrote or read, so an unchanged draft is not rewritten.
  function fresh(keepOrg) {
    return {
      step: 0, orgId: keepOrg ? state.orgId : null, orgName: keepOrg ? state.orgName : "",
      appId: null, appName: "", fleetId: null, fleetName: "", model: null, ctrl: null,
      answers: {}, done: {}, info: {}, draftFrom: "", savedDraft: "", sent: false
    };
  }
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var screen = document.getElementById("screen");
  var steps = document.getElementById("steps").children;
  Array.prototype.forEach.call(steps, function (b) {
    b.onclick = function () { if (!b.disabled) go(+b.dataset.step); };
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pathText(p) { return p.join(" › "); }
  function pathHtml(p) {
    return p.map(function (seg, i) { return (i === p.length - 1 ? "<b>" + esc(seg) + "</b>" : esc(seg)); }).join('<span class="sep">›</span>');
  }

  // ---- time helpers: "1:30" -> 90, "2" -> 120 (minutes), "45s" -> 45
  function parseTime(s) {
    if (s === undefined || s === null) return null;
    s = String(s).trim().toLowerCase();
    if (!s) return null;
    var m;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) return (+m[1]) * 60 + (+m[2]);
    if ((m = s.match(/^(\d{1,2})(\d{2})$/)) && +m[2] < 60) return (+m[1]) * 60 + (+m[2]); // "130" -> 1:30 (numeric keypads have no colon)
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*s(ec)?$/))) return Math.round(+m[1]);
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*(m|min)?$/))) return Math.round((+m[1]) * 60);
    return null;
  }
  function fmtMSS(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function fmtMin(sec) { var m = sec / 60; return (Math.round(m * 10) / 10) + ""; }

  function fieldIndex(k) {
    var idx = {};
    REQS[k].forEach(function (card) { card.fields.forEach(function (f) { idx[f.id] = f; }); });
    return idx;
  }
  // Resolve a field: {set:false} when blank, else {set:true, sec|rpm}
  function resolve(k, id) {
    var f = fieldIndex(k)[id]; if (!f) return { set: false };
    var raw = state.answers[id];
    if (!raw) return { set: false, f: f };
    if (f.unit === "time") { var sec = parseTime(raw); return sec === null ? { set: false, f: f } : { set: true, f: f, sec: sec }; }
    var n = parseFloat(raw); return isNaN(n) ? { set: false, f: f } : { set: true, f: f, rpm: n };
  }
  function drawVal(k, id) {
    var r = resolve(k, id), f = fieldIndex(k)[id];
    if (r.set) return r.sec !== undefined ? r.sec : r.rpm;
    return f.unit === "time" ? parseTime(f.typical) : parseFloat(f.typical);
  }
  function formatFor(r, fmt) {
    if (!r.set) return "leave as is";
    if (fmt === "mss") return fmtMSS(r.sec);
    if (fmt === "min") return fmtMin(r.sec) + " min";
    return r.rpm + " RPM";
  }

  function go(n) { state.step = n; save(); render(); window.scrollTo(0, 0); }

  function render() {
    document.getElementById("signout").hidden = !me;
    document.getElementById("steps").hidden = !me;
    if (!me) return renderSignIn();
    var c = state.ctrl && state.appId ? CONTROLLERS[state.ctrl] : null;
    for (var i = 0; i < steps.length; i++) {
      steps[i].className = (i < state.step ? "done " : "") + (i <= state.step ? "on " : "") + (i === state.step ? "now" : "");
      steps[i].disabled = i > 0 && !c; // later phases need an app and a controller first
      if (i === state.step) steps[i].setAttribute("aria-current", "step"); else steps[i].removeAttribute("aria-current");
    }
    if (state.step === 0 || !c) return renderPick();
    if (state.step === 1) return renderAsk(c);
    if (state.step === 2) return renderPanel(c);
    return renderSummary(c);
  }

  function renderSignIn() {
    if (!pool) {
      screen.innerHTML = '<div class="msg err">Sign-in could not load. Check the connection and reload the page.</div>';
      return;
    }
    screen.innerHTML = '<div class="head"><h2>Sign in to INCYT</h2><p>Use the same email and password as the INCYT app.</p></div>' +
      '<form id="login" class="card" novalidate>' +
      '<label class="field"><span>Email</span><input class="txt" id="em" type="email" autocomplete="username" autocapitalize="off" spellcheck="false"></label>' +
      '<label class="field"><span>Password</span><input class="txt" id="pw" type="password" autocomplete="current-password"></label>' +
      '<div class="msg err" id="lerr" hidden></div>' +
      '<button class="btn primary" type="submit" id="lbtn">Sign in</button></form>';
    var form = document.getElementById("login"), btn = document.getElementById("lbtn"), err = document.getElementById("lerr");
    form.onsubmit = function (e) {
      e.preventDefault();
      var em = document.getElementById("em").value.trim(), pw = document.getElementById("pw").value;
      if (!em || !pw) { err.textContent = "Enter your email and password."; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = "Signing in…"; err.hidden = true;
      signIn(em, pw).then(loadMe).then(render, function (e2) {
        err.textContent = (e2 && e2.message) || "Sign-in failed."; err.hidden = false;
        btn.disabled = false; btn.textContent = "Sign in";
      });
    };
  }

  function loadMe() {
    return rpc("user.getUser").then(function (u) {
      if (!u) throw new Error("Signed out");
      me = { name: [u.firstName, u.lastName].filter(Boolean).join(" ") || u.email, email: u.email };
    });
  }

  // ---- Phase 1: organisation, then app, then controller. Lists are fetched once per page load.
  var cache = { orgs: null, apps: {} };

  function renderPick() {
    if (!cache.orgs) {
      screen.innerHTML = '<p class="muted">Loading your organisations…</p>';
      rpc("org.getUserOrganisations").then(function (list) {
        cache.orgs = list.filter(function (o) { return EDIT_ROLES.indexOf(o.role) >= 0; });
        if (!state.orgId && cache.orgs.length === 1) { state.orgId = cache.orgs[0].orgId; state.orgName = cache.orgs[0].name; save(); }
        renderPick();
      }, showLoadError);
      return;
    }
    var h = head(1, "Which pump are you setting up?", "Choose the customer's organisation, the pump's app, then the controller fitted to the engine.");
    if (!cache.orgs.length) {
      screen.innerHTML = h + '<div class="msg err">Your login cannot change apps in any organisation. Ask the organisation\'s admin to add you as an Installer.</div>';
      return;
    }
    h += sec(1, "Organisation", !!state.orgId) +
      '<select class="txt" id="org" aria-label="Organisation"><option value="">Choose an organisation</option>';
    cache.orgs.forEach(function (o) { h += '<option value="' + esc(o.orgId) + '"' + (o.orgId === state.orgId ? " selected" : "") + '>' + esc(o.name) + '</option>'; });
    h += '</select><div id="apps"></div>' +
      '<div class="nav"><button class="btn primary" id="next1">Next: customer requirements</button></div>';
    screen.innerHTML = h;
    document.getElementById("org").onchange = function () {
      var o = cache.orgs.filter(function (x) { return x.orgId === this.value; }, this)[0];
      state = fresh(); state.orgId = o ? o.orgId : null; state.orgName = o ? o.name : ""; save();
      renderPick();
    };
    document.getElementById("next1").onclick = function () { go(1); };
    renderApps();
  }

  // Next is only live once there is an app and a controller.
  function syncNext() {
    var b = document.getElementById("next1");
    if (b) b.disabled = !(state.appId && state.model);
  }

  // ---- Shared screen pieces
  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function head(n, title, sub) {
    return '<div class="head"><div class="eyebrow">Step ' + n + ' of 4</div><h2>' + esc(title) + '</h2>' + (sub ? '<p>' + sub + '</p>' : "") + '</div>';
  }
  function sec(n, title, ok) {
    return '<div class="sec' + (ok ? " ok" : "") + '"><span class="num">' + (ok ? TICK.replace("<svg", '<svg width="14" height="14"') : n) + '</span>' + esc(title) + '</div>';
  }
  // Which pump this is, on every step after the first, with a way back to change it.
  function ctxBar() {
    return '<div class="ctx"><div class="t"><b>' + esc(state.appName) + '</b><span>' + esc(MODELS[state.model].name) + ' · ' + esc(state.orgName) + '</span></div>' +
      '<button type="button" class="link" id="chg">Change</button></div>';
  }
  function bindCtx() { var b = document.getElementById("chg"); if (b) b.onclick = function () { go(0); }; }
  function choice(attr, id, title, meta, on) {
    return '<button type="button" class="btn choice' + (on ? " sel" : "") + '" ' + attr + '="' + esc(id) + '" aria-pressed="' + !!on + '">' +
      '<span class="rad"></span><span class="ct"><span class="tt">' + esc(title) + '</span>' + (meta ? '<span class="meta">' + esc(meta) + '</span>' : "") + '</span></button>';
  }

  function renderApps() {
    var box = document.getElementById("apps");
    syncNext();
    if (!box || !state.orgId) { if (box) box.innerHTML = ""; return; }
    var apps = cache.apps[state.orgId];
    if (!apps) {
      box.innerHTML = sec(2, "Pump app") + '<p class="muted small">Loading apps…</p>';
      rpc("application.getApplications", { orgId: state.orgId, typeId: APP_TYPE }).then(function (list) {
        cache.apps[state.orgId] = list; renderApps();
      }, showLoadError);
      return;
    }
    if (!apps.length) { box.innerHTML = sec(2, "Pump app") + '<div class="msg warn">This organisation has no Engine Monitoring &amp; Control apps.</div>'; return; }
    var h = sec(2, "Pump app", !!state.appId);
    if (apps.length > 8) h += '<input class="txt" id="find" placeholder="Search apps" aria-label="Search apps" style="margin-bottom:10px">';
    h += '<div id="applist"></div><div id="models"></div>';
    box.innerHTML = h;
    var find = document.getElementById("find");
    function draw() {
      var q = find ? find.value.trim().toLowerCase() : "", out = "";
      apps.forEach(function (a) {
        if (q && a.name.toLowerCase().indexOf(q) < 0 && a.id !== state.appId) return;
        out += choice("data-app", a.id, a.name, a.fleetId ? "In fleet " + (a.fleetName || "") + ": engine settings set by hand" : "", a.id === state.appId);
      });
      document.getElementById("applist").innerHTML = out || '<p class="muted small">No apps match.</p>';
      document.querySelectorAll("[data-app]").forEach(function (b) {
        b.onclick = function () { pickApp(apps.filter(function (a) { return a.id === b.dataset.app; })[0]); };
      });
    }
    if (find) find.oninput = draw;
    draw();
    renderModels();
  }

  function renderModels() {
    var box = document.getElementById("models");
    syncNext();
    if (!box || !state.appId) { if (box) box.innerHTML = ""; return; }
    var h = sec(3, "Controller", !!state.model);
    if (state.draftFrom) h += '<div class="msg ok">Customer requirements saved by <b>' + esc(state.draftFrom) + '</b> are already filled in.</div>';
    Object.keys(MODELS).forEach(function (id) { h += choice("data-model", id, MODELS[id].name, "", id === state.model); });
    box.innerHTML = h;
    box.querySelectorAll("[data-model]").forEach(function (b) {
      b.onclick = function () {
        var m = b.dataset.model;
        if (state.ctrl && MODELS[m].ctrl !== state.ctrl) { state.answers = {}; state.done = {}; state.draftFrom = ""; } // other panel, other questions
        state.model = m; state.ctrl = MODELS[m].ctrl; save();
        renderModels();
      };
    });
  }

  // Choosing an app: start clean, take its current engine model, then pick up a saved draft if one exists.
  function pickApp(a) {
    state = fresh(true);
    state.appId = a.id; state.appName = a.name; state.fleetId = a.fleetId || null; state.fleetName = a.fleetName || "";
    var cur = a.settings && a.settings.engineModel;
    if (MODELS[cur]) { state.model = cur; state.ctrl = MODELS[cur].ctrl; }
    save();
    var box = document.getElementById("models");
    if (box) box.innerHTML = sec(3, "Controller") + '<p class="muted small">Checking for saved requirements…</p>';
    document.querySelectorAll("[data-app]").forEach(function (b) { var on = b.dataset.app === a.id; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); });
    syncNext();
    draftNotes().then(function (drafts) {
      var p = drafts.length ? parseDraft(drafts[0].body) : null; // newest first
      if (p) {
        state.model = p.model; state.ctrl = MODELS[p.model].ctrl; state.answers = p.answers;
        state.draftFrom = p.by || "another installer"; state.savedDraft = drafts[0].body;
      }
    }).catch(function () {}).then(function () { save(); renderModels(); });
  }

  function showLoadError(e) {
    screen.innerHTML = '<div class="msg err">' + esc((e && e.message) || "Could not reach INCYT.") + '</div>' +
      '<button class="btn primary" id="retry">Try again</button>';
    document.getElementById("retry").onclick = function () { cache = { orgs: null, apps: {} }; render(); };
  }

  // ---- Shared draft: one note on the app holds the customer requirements so far, readable by people and by this page.
  function reqLines(k) {
    return REQS[k].map(function (card) {
      return "- " + card.title + ": " + card.fields.map(function (f) {
        var r = resolve(k, f.id);
        return f.label + " " + (r.set ? (r.sec !== undefined ? fmtMSS(r.sec) : r.rpm + " RPM") : "left as is");
      }).join(", ");
    });
  }
  function parseDraft(body) {
    var lines = String(body || "").split(/\r?\n/), model = null, by = "", answers = {};
    if (lines[0] !== DRAFT_HEAD) return null;
    lines.forEach(function (ln) {
      var m = ln.match(/^Controller: (.+)$/);
      if (m) Object.keys(MODELS).forEach(function (id) { if (MODELS[id].name === m[1].trim()) model = id; });
      var s = ln.match(/^Started by (.+)$/); if (s) by = s[1].trim();
    });
    if (!model) return null;
    REQS[MODELS[model].ctrl].forEach(function (card) {
      var pre = "- " + card.title + ": ";
      var line = lines.filter(function (ln) { return ln.indexOf(pre) === 0; })[0];
      if (!line) return;
      var parts = line.slice(pre.length).split(", ");
      card.fields.forEach(function (f) {
        var p = parts.filter(function (x) { return x.indexOf(f.label + " ") === 0; })[0];
        if (!p) return;
        var v = p.slice(f.label.length + 1).replace(/ RPM$/, "");
        if (v !== "left as is") answers[f.id] = v;

      s += '<text text-anchor="middle" x="' + cx.toFixed(1) + '" y="' + (T - 5) + '">' + (b.p.sec === null ? "until stopped" : fmtMSS(b.p.sec)) + '</text>';

      h += '<li><span class="ic">' + TICK + '</span><div><b>Set the app\'s engine settings</b>' + list(planLines(plan.settings)) + '</div></li>';
    }
    h += '</ul><details class="preview"><summary>Preview the install note</summary><pre class="sum">' +
      esc(finalNote(settingsLine(plan, state.fleetId ? state.fleetName : ""))) + '</pre></details>' +
      '<div id="sendmsg" aria-live="polite"></div>' +
      '<div class="nav"><button class="btn back" id="back">Back</button><button class="btn primary" id="send"' + (plan.err ? " disabled" : "") + '>Send to INCYT</button></div>';
    screen.innerHTML = h;
    bindCtx();
    document.getElementById("back").onclick = function () { go(2); };
    document.getElementById("send").onclick = function () { send(plan); };
  }

  // Order: check fleet now (it may have changed), set settings, then swap the drafts for the final note.
  function send(plan) {
    var btn = document.getElementById("send"), out = document.getElementById("sendmsg");
    btn.disabled = true; btn.textContent = "Sending…"; out.innerHTML = "";
    var fleetName = "";
    rpc("application.getApplications", { orgId: state.orgId, typeId: APP_TYPE }).then(function (list) {
      var a = list.filter(function (x) { return x.id === state.appId; })[0];
      if (!a) throw new Error("This app is no longer in " + state.orgName + ".");
      state.fleetId = a.fleetId || null; state.fleetName = a.fleetName || ""; fleetName = state.fleetId ? (state.fleetName || "unnamed") : "";
      if (fleetName) return;
      return rpc("application.setApplicationSettings", { applicationInstanceId: state.appId, settings: plan.settings, targetScope: "current" }, true);
    }).then(function () {
      return draftNotes();
    }).then(function (drafts) {
      return addNote(finalNote(settingsLine(plan, fleetName))).then(function () { return removeNotes(drafts); });
    }).then(function () {
      state.sent = true; state.savedDraft = ""; save(); renderSummary(CONTROLLERS[state.ctrl]);
    }, function (e) {
      out.innerHTML = '<div class="msg err">Not sent: ' + esc(String((e && e.message) || "no connection").replace(/\.?$/, ".")) + ' Try again when you have signal.</div>';
      btn.disabled = false; btn.textContent = "Try again";
    });
  }

  document.getElementById("signout").onclick = function () {
    var u = pool && pool.getCurrentUser(); if (u) u.signOut();
    me = null; cache = { orgs: null, apps: {} }; state = fresh(); save(); render();
  };
  if (ENV_NAME === "dev") {
    var tag = document.createElement("span"); tag.className = "env"; tag.textContent = "DEV";
    document.getElementById("title").after(tag);
  }

  function start(data) {
    if (data && data.step !== undefined) state = data;
    if (!pool || !pool.getCurrentUser()) return render();
    screen.innerHTML = '<p class="muted">Signing in…</p>';
    loadMe().then(render, function () { me = null; render(); });
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return state; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>

</body>
