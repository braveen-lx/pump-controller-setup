<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Pump Controller Setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F4F5F1;
    --card: #FFFFFF;
    --ink: #1A1D19;
    --muted: #626A5F;
    --line: #D9DDD4;
    --grid: #E6E9E2;
    --accent: #C4521A;
    --accent-soft: rgba(196, 82, 26, .12);
    --accent-ink: #FFFFFF;
    --good: #2A7A4B;
    --good-bg: #E5F2EA;
    --focus: #1F5FA8;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141613; --card: #1D201C; --ink: #ECEFE8; --muted: #9AA395; --line: #343A32; --grid: #262B25;
      --accent: #EE7A3C; --accent-soft: rgba(238, 122, 60, .16); --accent-ink: #1A1D19; --good: #5FBF86; --good-bg: #1E2F25; --focus: #7FB2F0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141613; --card: #1D201C; --ink: #ECEFE8; --muted: #9AA395; --line: #343A32; --grid: #262B25;
    --accent: #EE7A3C; --accent-soft: rgba(238, 122, 60, .16); --accent-ink: #1A1D19; --good: #5FBF86; --good-bg: #1E2F25; --focus: #7FB2F0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.4; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .steps { display: flex; gap: 6px; margin: 14px 0 20px; }
  .steps button { flex: 1; display: block; padding: 8px 0 6px; margin: 0; border: 0; border-top: 4px solid var(--line); border-radius: 0; background: transparent; text-align: left; font-size: 13px; line-height: 1.2; color: var(--muted); }
  .steps button.on { border-top-color: var(--accent); }
  .steps button.now { color: var(--ink); font-weight: 600; }
  .steps button:disabled { cursor: default; opacity: .6; }
  .steps button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .steps button small { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 400; }

  button { font: inherit; cursor: pointer; }
  .btn { display: block; width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-align: left; font-size: 17px; font-weight: 500; }
  .btn + .btn { margin-top: 10px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-align: center; font-weight: 600; }
  .btn.ghost { background: transparent; text-align: center; color: var(--muted); border-color: transparent; }
  .btn:focus-visible, input:focus-visible, .grp:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .nav { display: flex; gap: 10px; margin-top: 20px; }
  .nav .btn { margin: 0; }
  .nav .back { flex: 0 0 auto; width: auto; text-align: center; }

  /* run profile chart */
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 4px; margin-bottom: 8px; }
  .chart svg { display: block; width: 100%; height: auto; font-family: var(--mono); }
  .chart .band { fill: var(--grid); opacity: .6; }
  .chart .sepl { stroke: var(--line); stroke-width: 1; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .lim { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .area { fill: var(--accent-soft); }
  .chart .trace { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart text { fill: var(--muted); font-size: 9px; }
  .chart text.ph { fill: var(--ink); font-weight: 500; font-family: var(--sans); font-size: 10px; }
  .chart text.v { fill: var(--ink); font-weight: 500; }
  .chart text.limlab { text-anchor: end; }

  /* customer requirement cards */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .q .title { font-weight: 600; margin-bottom: 8px; }
  .q .fields { display: flex; gap: 10px; flex-wrap: wrap; }
  .q .f { flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; }
  .q .f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .q .ctl { display: flex; gap: 6px; align-items: center; flex: 1; } /* flex:1 so a 44px box centres beside a 132px drum */
  .q input { flex: 1; min-width: 0; width: 100%; font: inherit; font-family: var(--mono); font-size: 17px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .q .unit { font-family: var(--mono); color: var(--muted); font-size: 13px; }
  /* touch time picker: a snapping drum, middle row is the value */
  .q .drum { position: relative; flex: 1; min-width: 0; height: 132px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .q .drum::after { content: ""; position: absolute; left: 6px; right: 6px; top: 44px; height: 44px; border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent); border-radius: 4px; pointer-events: none; }
  .q .drum .list { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
  .q .drum .list::-webkit-scrollbar { display: none; }
  .q .drum .pad { height: 44px; }
  .q .drum .opt { height: 44px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 18px; color: var(--muted); }
  .q .drum .opt.sel { color: var(--ink); font-weight: 500; }
  .q .drum .edit { position: absolute; inset: 0; width: 100%; height: 100%; border: 2px solid var(--accent); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; font-family: var(--mono); font-size: 20px; text-align: center; z-index: 2; }
  .q .same { font-size: 13px; color: var(--muted); align-self: center; }

  /* panel menu groups: one tick per menu */
  .grp { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .grp.done { background: var(--good-bg); border-color: var(--good); }
  .grp input { width: 24px; height: 24px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--good); }
  .grp .body { flex: 1; min-width: 0; }
  .grp .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grp .path { font-size: 17px; font-weight: 600; line-height: 1.25; margin-bottom: 6px; }
  .grp .path b { color: var(--accent); font-weight: 600; }
  .grp .sep { color: var(--muted); font-weight: 400; padding: 0 4px; }
  .grp .it { display: flex; gap: 8px; justify-content: space-between; padding: 3px 0; border-top: 1px solid var(--grid); }
  .grp .it:first-of-type { border-top: 0; }
  .grp .set { min-width: 0; }
  .grp .sub { color: var(--muted); }
  .grp .val { font-family: var(--mono); font-weight: 500; text-align: right; white-space: nowrap; }
  .grp .val.leave { color: var(--muted); font-weight: 400; }
  .grp .note { font-size: 13px; color: var(--muted); margin-top: 6px; }

  pre.sum { white-space: pre-wrap; font-family: var(--mono); font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0 0 12px; overflow-x: auto; }
  .site { width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin-bottom: 12px; }
  .toast { color: var(--good); font-weight: 500; min-height: 22px; margin-top: 8px; text-align: center; }
  @media (prefers-reduced-motion: no-preference) { .grp, .btn { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>

<div class="wrap">
  <h1 id="title">Pump Controller Setup</h1>
  <div class="steps" id="steps">
    <button type="button" class="on now" data-step="0"><small>Phase 1</small>Engine</button>
    <button type="button" data-step="1"><small>Phase 2</small>Customer</button>
    <button type="button" data-step="2"><small>Phase 3</small>Panel</button>
    <button type="button" data-step="3"><small>Phase 4</small>Send</button>
  </div>
  <div id="screen"></div>
</div>

<script>
(function () {
  // ---- Customer requirements: how the engine should run. Blank = leave the panel as it is.
  // unit "rpm" or "time". Times are typed as m:ss or minutes and stored as seconds.
  var REQS = {
    kensho: [
      { id: "warm", title: "Warm up", fields: [ { id: "warmTime", label: "How long", unit: "time", typical: "0:00" }, { id: "idle", label: "Idle speed", unit: "rpm", typical: "800" } ] },
      { id: "fill", title: "Line fill", fields: [ { id: "fillTime", label: "How long", unit: "time", typical: "1:30" }, { id: "fillSpeed", label: "Speed", unit: "rpm", typical: "825" } ] },
      { id: "run", title: "Run", fields: [ { id: "run", label: "Speed", unit: "rpm", typical: "850" } ] },
      { id: "cool", title: "Cool down", fields: [ { id: "coolTime", label: "How long", unit: "time", typical: "2:00" } ], same: "at idle speed" },
      { id: "lim", title: "Range INCYT may request", fields: [ { id: "min", label: "Lowest", unit: "rpm", typical: "1000" }, { id: "max", label: "Highest", unit: "rpm", typical: "1800" } ] }
    ],
    murphy: [
      { id: "warm", title: "Warm up", fields: [ { id: "warmTime", label: "How long", unit: "time", typical: "1:30" }, { id: "warmSpeed", label: "Speed", unit: "rpm", typical: "800" } ] },
      { id: "run", title: "Run", fields: [ { id: "run", label: "Speed", unit: "rpm", typical: "900" } ] },
      { id: "cool", title: "Cool down", fields: [ { id: "coolTime", label: "How long", unit: "time", typical: "2:00" }, { id: "coolSpeed", label: "Speed", unit: "rpm", typical: "800" } ] },
      { id: "lim", title: "Range INCYT may request", fields: [ { id: "min", label: "Lowest", unit: "rpm", typical: "800" }, { id: "max", label: "Highest", unit: "rpm", typical: "1600" } ] }
    ]
  };

  // ---- Panel menus, in panel order. One tick per menu.
  // item: [setting, value] | [setting, value, subpath] | { f, set, fmt, sub? }
  var CONTROLLERS = {
    kensho: {
      name: "Kensho K27 / K37",
      menus: [
        { path: ["Set Timers"], items: [
          ["Set Stop Timer", "Disabled"], ["Delay Btw Starts", "Disabled"],
          ["Function Enable", "Disabled", "Set 7 Day Timer"], ["Purge Timer", "Disabled", "Purge Timers"]
        ]},
        { path: ["User Settings", "Engine"], items: [
          { f: "run", set: "Engine Run Speed", fmt: "rpm" },
          { f: "warmTime", set: "Warm Up Time", fmt: "mss" },
          { f: "coolTime", set: "Cool Down Time", fmt: "mss" }
        ]},
        { path: ["User Settings", "Throttle"], items: [
          ["Throttle Type", "Modbus Control"],
          { f: "idle", set: "Engine Idle", fmt: "rpm" },
          { f: "fillSpeed", set: "Line Fill Speed", fmt: "rpm" },
          { f: "fillTime", set: "Line Fill Time", fmt: "mss" },
          { f: "max", set: "MaxRPM @ Variable", fmt: "rpm" },
          { f: "min", set: "MinRPM @ Variable", fmt: "rpm" },
          ["RampRate RPM/Sec", "10"]
        ]},
        { path: ["User Settings", "4-20mA Sensor"], note: "Protection shutdowns can stay. Anything that changes engine speed on its own must be off.", items: [
          ["Sender Function", "Disabled", "Flow Sensor"],
          ["Sender Function", "Disabled", "Pressure Sensor"]
        ]},
        { path: ["User Settings", "Suction 4-20mA"], items: [ ["Sender Function", "Disabled"] ] },
        { path: ["User Settings", "Dam Level"], items: [ ["Sender Function", "Disabled"] ] },
        { path: ["User Settings", "Start Type"], items: [ ["Set Start Type", "Momentary"], ["Input Type", "Start NO Stop NO"], ["Force Auto", "Enabled"] ] },
        { path: ["User Settings", "Modbus"], items: [ ["Modbus Channel", "RS232 (GSM Disable)"], ["Slave Address", "10"], ["Baudrate", "38400"] ] },
        { path: ["User Settings", "GSM"], items: [ ["Active", "Disabled"] ] }
      ]
    },
    murphy: {
      name: "Murphy TEC-10",
      menus: [
        { path: ["System"], items: [ ["Standby Timer", "0"] ] },
        { path: ["User Settings"], note: "Running Loaded Speed is shown in Speed Settings but is changed under Application Configuration. The same speed values also appear under Engine Settings.", items: [
          ["Speed Source", "J1939", "Speed Settings"],
          { f: "warmSpeed", set: "Warm Up Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "warmTime", set: "Warm Up Delay", fmt: "mss", sub: "Speed Settings" },
          { f: "coolSpeed", set: "Cooldown Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "coolTime", set: "Cooldown Delay", fmt: "min", sub: "Speed Settings" },
          ["Warmup Manual Mode", "Enabled", "Speed Settings"],
          ["Cooldown Manual Mode", "Enabled", "Speed Settings"],
          { f: "min", set: "Minimum Engine Speed", fmt: "rpm", sub: "Speed Settings" },
          { f: "max", set: "Maximum Engine Speed", fmt: "rpm", sub: "Speed Settings" },
          ["Auto Throttle Method", "Running Loaded"],
          ["Function", "Disabled", "Analog Input 3"]
        ]},
        { path: ["Advanced Engine Settings"], items: [ ["Address Claim", "3"] ] },
        { path: ["Input/Output", "Relay & Digital Outputs"], items: [ ["DO2 (B+, 1A)", "Ignition On"] ], note: "Not highlighted on the config sheet; included because TEC-10 pin 24 is wired to the Senquip." },
        { path: ["Application Configuration"], items: [ { f: "run", set: "Running Loaded Speed", fmt: "rpm" } ] },
        { path: ["Communication"], items: [ ["Communication Type", "Modbus"], ["Slave Address", "3"], ["Baudrate", "38400"], ["Stopbits", "1"], ["Parity", "None"] ] }
      ]
    }
  };

  var KEY = "pcs-state-v4";
  // Desktop = a real pointer that can hover (mouse or trackpad). Phones and tablets fall through to typing.
  var DESKTOP = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
  var state = load() || fresh();

  function fresh() { return { step: 0, ctrl: null, answers: {}, done: {}, site: "" }; }
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var screen = document.getElementById("screen");
  var steps = document.getElementById("steps").children;
  Array.prototype.forEach.call(steps, function (b) {
    b.onclick = function () { if (!b.disabled) go(+b.dataset.step); };
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pathText(p) { return p.join(" › "); }
  function pathHtml(p) {
    return p.map(function (seg, i) { return (i === p.length - 1 ? "<b>" + esc(seg) + "</b>" : esc(seg)); }).join('<span class="sep">›</span>');
  }

  // ---- time helpers: "1:30" -> 90, "2" -> 120 (minutes), "45s" -> 45
  function parseTime(s) {
    if (s === undefined || s === null) return null;
    s = String(s).trim().toLowerCase();
    if (!s) return null;
    var m;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) return (+m[1]) * 60 + (+m[2]);
    if ((m = s.match(/^(\d{1,2})(\d{2})$/)) && +m[2] < 60) return (+m[1]) * 60 + (+m[2]); // "130" -> 1:30 (numeric keypads have no colon)
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*s(ec)?$/))) return Math.round(+m[1]);
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*(m|min)?$/))) return Math.round((+m[1]) * 60);
    return null;
  }
  function fmtMSS(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function fmtMin(sec) { var m = sec / 60; return (Math.round(m * 10) / 10) + ""; }

  function fieldIndex(k) {
    var idx = {};
    REQS[k].forEach(function (card) { card.fields.forEach(function (f) { idx[f.id] = f; }); });
    return idx;
  }
  // Resolve a field: {set:false} when blank, else {set:true, sec|rpm}
  function resolve(k, id) {
    var f = fieldIndex(k)[id]; if (!f) return { set: false };
    var raw = state.answers[id];
    if (!raw) return { set: false, f: f };
    if (f.unit === "time") { var sec = parseTime(raw); return sec === null ? { set: false, f: f } : { set: true, f: f, sec: sec }; }
    var n = parseFloat(raw); return isNaN(n) ? { set: false, f: f } : { set: true, f: f, rpm: n };
  }
  function drawVal(k, id) {
    var r = resolve(k, id), f = fieldIndex(k)[id];
    if (r.set) return r.sec !== undefined ? r.sec : r.rpm;
    return f.unit === "time" ? parseTime(f.typical) : parseFloat(f.typical);
  }
  function formatFor(r, fmt) {
    if (!r.set) return "leave as is";
    if (fmt === "mss") return fmtMSS(r.sec);
    if (fmt === "min") return fmtMin(r.sec) + " min";
    return r.rpm + " RPM";
  }

  function go(n) { state.step = n; save(); render(); window.scrollTo(0, 0); }

  function render() {
    var c = state.ctrl ? CONTROLLERS[state.ctrl] : null;
    for (var i = 0; i < steps.length; i++) {
      steps[i].className = (i <= state.step ? "on" : "") + (i === state.step ? " now" : "");
      steps[i].disabled = i > 0 && !c; // later phases need a controller first
    }
    if (state.step === 0 || !c) return renderPick();
    if (state.step === 1) return renderAsk(c);
    if (state.step === 2) return renderPanel(c);
    return renderSummary(c);
  }

  function renderPick() {
    var h = "";
    if (state.ctrl) {
      var started = state.site ? state.site + " (" + CONTROLLERS[state.ctrl].name + ")" : CONTROLLERS[state.ctrl].name;
      h += '<h2>Install in progress</h2>' +
        '<button class="btn primary" id="resume">Continue ' + esc(started) + '</button>' +
        '<button class="btn" id="newinstall">Start a new install</button>';
    } else {
      h += '<h2>Which controller?</h2>';
      Object.keys(CONTROLLERS).forEach(function (k) {
        h += '<button class="btn" data-ctrl="' + k + '">' + esc(CONTROLLERS[k].name) + '</button>';
      });
    }
    screen.innerHTML = h;
    screen.querySelectorAll("[data-ctrl]").forEach(function (b) {
      b.onclick = function () { state = fresh(); state.ctrl = b.dataset.ctrl; go(1); };
    });
    var r = document.getElementById("resume"); if (r) r.onclick = function () { go(1); };
    var n = document.getElementById("newinstall"); if (n) n.onclick = function () { state = fresh(); save(); renderPick(); };
  }

  // ---- Run profile chart: speed over one engine run, one band per phase.
  function profileSvg(k) {
    var isK = k === "kensho";
    var idle = isK ? drawVal(k, "idle") : null;
    var ph = [];
    ph.push({ name: "warm up", sec: drawVal(k, "warmTime"), rpm: isK ? idle : drawVal(k, "warmSpeed") });
    if (isK) ph.push({ name: "line fill", sec: drawVal(k, "fillTime"), rpm: drawVal(k, "fillSpeed") });
    ph.push({ name: "run", sec: null, rpm: drawVal(k, "run") });
    ph.push({ name: "cool down", sec: drawVal(k, "coolTime"), rpm: isK ? idle : drawVal(k, "coolSpeed") });
    var min = drawVal(k, "min"), max = drawVal(k, "max");
    ph = ph.filter(function (p) { return p.sec === null || p.sec > 0; });

    var W = 360, H = 200, L = 8, R = 54, T = 40, B = 18, END = 14;
    var plotW = W - L - R - END, plotH = H - T - B;
    var top = Math.max(max, ph.reduce(function (m, p) { return Math.max(m, p.rpm || 0); }, 0)) * 1.12;
    var y = function (rpm) { return T + plotH - (rpm / top) * plotH; };

    var weight = function (p) { return p.sec === null ? 2.4 : 1 + Math.min(p.sec, 300) / 120; };
    var sumW = ph.reduce(function (a, p) { return a + weight(p); }, 0);
    var bands = [], x = L;
    ph.forEach(function (p, i) { var w = plotW * weight(p) / sumW; bands.push({ p: p, x0: x, x1: x + w, i: i }); x += w; });

    var pts = [[L, y(0)]];
    bands.forEach(function (b) {
      var ramp = Math.min(16, (b.x1 - b.x0) * 0.3);
      pts.push([b.x0 + ramp, y(b.p.rpm)]); pts.push([b.x1, y(b.p.rpm)]);
    });
    pts.push([x + END, y(0)]);
    var path = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
    var area = path + " L" + (x + END).toFixed(1) + " " + y(0).toFixed(1) + " L" + L + " " + y(0).toFixed(1) + " Z";

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Engine speed over one run">';
    bands.forEach(function (b) {
      if (b.i % 2) s += '<rect class="band" x="' + b.x0.toFixed(1) + '" y="' + T + '" width="' + (b.x1 - b.x0).toFixed(1) + '" height="' + plotH + '"/>';
      if (b.i) s += '<line class="sepl" x1="' + b.x0.toFixed(1) + '" x2="' + b.x0.toFixed(1) + '" y1="' + (T - 26) + '" y2="' + (T + plotH) + '"/>';
      var cx = (b.x0 + b.x1) / 2;
      s += '<text class="ph" text-anchor="middle" x="' + cx.toFixed(1) + '" y="' + (T - 16) + '">' + esc(b.p.name) + '</text>';
      s += '<text text-anchor="middle" x="' + cx.toFixed(1) + '" y="' + (T - 5) + '">' + (b.p.sec === null ? "until stopped" : fmtMSS(b.p.sec)) + '</text>';
    });
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
    [max, min].forEach(function (v, i) {
      s += '<line class="lim" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>';
      s += '<text class="limlab" x="' + (W - 2) + '" y="' + (y(v) + 3).toFixed(1) + '">' + (i ? "min " : "max ") + v + '</text>';
    });
    s += '<path class="area" d="' + area + '"/><path class="trace" d="' + path + '"/>';
    bands.forEach(function (b) {
      var ramp = Math.min(16, (b.x1 - b.x0) * 0.3);
      var cx = (b.x0 + ramp + b.x1) / 2, ty = y(b.p.rpm);
      var ly = ty - 5, nearLim = [min, max].some(function (v) { return Math.abs(ly - 3 - y(v)) < 8; });
      var above = ly > T + 10 && !nearLim;
      s += '<text class="v" text-anchor="middle" x="' + cx.toFixed(1) + '" y="' + (above ? ly : ty + 12).toFixed(1) + '">' + b.p.rpm + ' rpm</text>';
    });
    s += '<text x="' + L + '" y="' + (H - 4) + '">start</text><text text-anchor="end" x="' + (W - R) + '" y="' + (H - 4) + '">stop</text>';
    s += '</svg>';
    return s;
  }

  function renderAsk(c) {
    var k = state.ctrl;
    var h = '<h2>How should the engine run?</h2>' +
      '<div class="chart" id="chart">' + profileSvg(k) + '</div>' +
      '<p class="muted small">Blank means leave the panel as it is. Grey numbers are the usual values.' +
      (DESKTOP ? ' Scroll or use the arrow keys on a time box to step it by 15 seconds.' : ' Flick a wheel to set it; the dash at the top leaves it as it is.') + '</p>';
    REQS[k].forEach(function (card) {
      h += '<div class="q"><div class="title">' + esc(card.title) + '</div><div class="fields">';
      card.fields.forEach(function (f) {
        var v = state.answers[f.id] || "";
        if (!DESKTOP) {
          // Touch: a drum of values, filled in by initDrum. Time is 15 s apart up to 10 minutes; RPM is 25 apart from 600 to 2400.
          var isT = f.unit === "time";
          h += '<div class="f"><label id="lab-' + f.id + '">' + esc(f.label) + '</label><div class="ctl">' +
            '<div class="drum" data-f="' + f.id + '" data-unit="' + f.unit + '" data-lo="' + (isT ? 0 : 600) + '" data-hi="' + (isT ? 600 : 2400) + '" data-st="' + (isT ? 15 : 25) + '" role="listbox" aria-labelledby="lab-' + f.id + '"></div>' +
            '<span class="unit">' + (isT ? "m:ss" : "RPM") + '</span></div></div>';
          return;
        }
        h += '<div class="f"><label for="q-' + f.id + '">' + esc(f.label) + '</label><div class="ctl">' +
          '<input id="q-' + f.id + '" data-f="' + f.id + '" inputmode="' + (f.unit === "time" ? "numeric" : "decimal") + '" placeholder="' + esc(f.typical) + '" value="' + esc(v) + '">' +
          '<span class="unit">' + (f.unit === "time" ? "m:ss" : "RPM") + '</span></div></div>';
      });
      if (card.same) h += '<div class="same">' + esc(card.same) + '</div>';
      h += '</div></div>';
    });
    h += '<div class="nav"><button class="btn back" id="back">Back</button><button class="btn primary" id="next">Next</button></div>';
    screen.innerHTML = h;
    var fields = fieldIndex(k);
    screen.querySelectorAll("input[data-f]").forEach(function (inp) {
      var f = fields[inp.dataset.f];
      inp.oninput = function () { state.answers[inp.dataset.f] = inp.value.trim(); save(); document.getElementById("chart").innerHTML = profileSvg(k); };
      if (f.unit !== "time") return;
      // Step a time box: 15 s per step (5 s with Shift), from the usual value if blank.
      function step(dir, by) {
        var cur = parseTime(inp.value); if (cur === null) cur = parseTime(f.typical) || 0;
        cur = Math.max(0, cur + dir * (by || 15));
        inp.value = fmtMSS(cur);
        inp.dispatchEvent(new Event("input"));
      }
      // Typed "2" or "90s" becomes m:ss when leaving the box, on every device.
      inp.addEventListener("blur", function () { var s = parseTime(inp.value); if (s !== null && inp.value.trim()) { inp.value = fmtMSS(s); inp.dispatchEvent(new Event("input")); } });
      inp.addEventListener("wheel", function (e) { e.preventDefault(); if (document.activeElement !== inp) inp.focus(); step(e.deltaY < 0 ? 1 : -1, e.shiftKey ? 5 : 15); }, { passive: false });
      inp.addEventListener("keydown", function (e) { if (e.key === "ArrowUp") { e.preventDefault(); step(1, e.shiftKey ? 5 : 15); } else if (e.key === "ArrowDown") { e.preventDefault(); step(-1, e.shiftKey ? 5 : 15); } });
      inp.title = "Scroll or press up/down to adjust";
    });
    screen.querySelectorAll(".drum").forEach(function (drum) { initDrum(drum, k); });
    document.getElementById("back").onclick = function () { go(0); };
    document.getElementById("next").onclick = function () { go(2); };
  }

  // ---- Touch drum: the row that snaps into the middle band is the value.
  // Tap the highlighted row to type a value instead; tap another row to scroll to it.
  var ROW = 44;
  function initDrum(drum, k) {
    var fid = drum.dataset.f, isT = drum.dataset.unit === "time";
    var lo = +drum.dataset.lo, hi = +drum.dataset.hi, st = +drum.dataset.st;
    var list = document.createElement("div"); list.className = "list"; drum.appendChild(list);
    var opts = [], t = null;

    function fmt(v) { return isT ? fmtMSS(v) : String(v); }
    function current() {
      var raw = state.answers[fid]; if (!raw) return null;
      var n = isT ? parseTime(raw) : parseFloat(raw);
      return (n === null || isNaN(n)) ? null : n;
    }
    // Rows: dash, then the grid, plus the current value if it is off the grid.
    function build(extra) {
      var vals = []; for (var v = lo; v <= hi; v += st) vals.push(v);
      if (extra !== null && extra !== undefined && vals.indexOf(extra) < 0) { vals.push(extra); vals.sort(function (a, b) { return a - b; }); }
      var h = '<div class="pad"></div><div class="opt" data-s="">—</div>';
      vals.forEach(function (v) { h += '<div class="opt" data-s="' + v + '">' + fmt(v) + '</div>'; });
      list.innerHTML = h + '<div class="pad"></div>';
      opts = list.querySelectorAll(".opt");
    }
    function indexOf(val) { for (var i = 0; i < opts.length; i++) if (opts[i].dataset.s !== "" && +opts[i].dataset.s === val) return i; return 0; }
    function mark(i) { opts.forEach(function (o, j) { o.classList.toggle("sel", j === i); }); }
    function store(val) {
      var s = val === null ? "" : fmt(val);
      if (state.answers[fid] !== s) { state.answers[fid] = s; save(); document.getElementById("chart").innerHTML = profileSvg(k); }
    }
    function commit() {
      var i = Math.max(0, Math.min(opts.length - 1, Math.round(list.scrollTop / ROW)));
      mark(i);
      var s = opts[i].dataset.s; store(s === "" ? null : +s);
    }
    function setTo(val) { build(val); var i = val === null ? 0 : indexOf(val); list.scrollTop = i * ROW; mark(i); store(val); }

    function openEditor() {
      if (drum.querySelector(".edit")) return;
      var inp = document.createElement("input");
      inp.className = "edit"; inp.setAttribute("inputmode", isT ? "numeric" : "decimal"); inp.setAttribute("autocomplete", "off");
      inp.placeholder = isT ? "1:30 or 130" : "RPM"; inp.value = state.answers[fid] || "";
      drum.appendChild(inp); inp.focus(); inp.select();
      var done = false;
      function finish(apply) {
        if (done) return; done = true;
        if (apply) {
          var raw = inp.value.trim();
          if (!raw) setTo(null);
          else { var n = isT ? parseTime(raw) : parseFloat(raw); if (n !== null && !isNaN(n)) setTo(Math.max(0, Math.round(n))); }
        }
        inp.remove();
      }
      inp.addEventListener("blur", function () { finish(true); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); else if (e.key === "Escape") finish(false); });
    }

    var c = current(); build(c); var start = c === null ? 0 : indexOf(c); list.scrollTop = start * ROW; mark(start);
    list.addEventListener("scroll", function () { clearTimeout(t); t = setTimeout(commit, 90); }, { passive: true });
    list.addEventListener("scrollend", commit);
    list.addEventListener("click", function (e) {
      var o = e.target.closest ? e.target.closest(".opt") : null; if (!o) return;
      if (o.classList.contains("sel")) openEditor();
      else list.scrollTo({ top: Array.prototype.indexOf.call(opts, o) * ROW, behavior: "smooth" });
    });
  }

  // Resolve a menu's items to display lines.
  function menuLines(k, menu) {
    return menu.items.map(function (it) {
      if (it.f) { var r = resolve(k, it.f); return { set: it.set, sub: it.sub, val: formatFor(r, it.fmt), leave: !r.set }; }
      return { set: it[0], sub: it[2], val: it[1] };
    });
  }

  function renderPanel(c) {
    var k = state.ctrl;
    var h = '<h2>Set on the panel</h2><p class="muted small">Tick each menu when it is done.</p>';
    c.menus.forEach(function (menu, mi) {
      var id = "m" + mi, d = !!state.done[id];
      h += '<label class="grp' + (d ? " done" : "") + '"><input type="checkbox" id="chk-' + id + '" data-id="' + id + '"' + (d ? " checked" : "") + '>' +
        '<div class="body"><div class="eyebrow">Menu</div><div class="path">' + pathHtml(menu.path) + '</div>';
      menuLines(k, menu).forEach(function (l) {
        h += '<div class="it"><span class="set">' + (l.sub ? '<span class="sub">' + esc(l.sub) + ' › </span>' : "") + esc(l.set) + '</span>' +
          '<span class="val' + (l.leave ? " leave" : "") + '">' + esc(l.val) + '</span></div>';
      });
      if (menu.note) h += '<div class="note">' + esc(menu.note) + '</div>';
      h += '</div></label>';
    });
    h += '<div class="nav"><button class="btn back" id="back">Back</button><button class="btn primary" id="next">Finish</button></div>';
    screen.innerHTML = h;
    screen.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
      cb.onchange = function () { state.done[cb.dataset.id] = cb.checked; save(); renderPanel(c); };
    });
    document.getElementById("back").onclick = function () { go(1); };
    document.getElementById("next").onclick = function () { go(3); };
  }

  function summaryText(c) {
    var k = state.ctrl;
    var lines = ["INCYT pump control setup", "Controller: " + c.name];
    if (state.site) lines.push("Site: " + state.site);
    lines.push("Date: " + new Date().toISOString().slice(0, 10), "", "Customer requirements");
    REQS[k].forEach(function (card) {
      var parts = card.fields.map(function (f) {
        var r = resolve(k, f.id);
        return f.label + " " + (r.set ? (r.sec !== undefined ? fmtMSS(r.sec) : r.rpm + " RPM") : "left as is");
      });
      lines.push("- " + card.title + ": " + parts.join(", "));
    });
    var notDone = [];
    c.menus.forEach(function (menu, mi) { if (!state.done["m" + mi]) notDone.push(pathText(menu.path)); });
    lines.push("", "Panel menus done: " + (c.menus.length - notDone.length) + " / " + c.menus.length);
    if (notDone.length) { lines.push("Not done:"); notDone.forEach(function (m) { lines.push("- " + m); }); }
    return lines.join("\n");
  }

  function renderSummary(c) {
    var h = '<h2>Send this back</h2>' +
      '<input class="site" id="site" placeholder="Site or pump name (optional)" value="' + esc(state.site) + '">' +
      '<pre class="sum" id="sum">' + esc(summaryText(c)) + '</pre>' +
      '<button class="btn primary" id="copy">Copy summary</button><div class="toast" id="toast"></div>' +
      '<div class="nav"><button class="btn back" id="back">Back</button><button class="btn ghost" id="reset">Start another</button></div>';
    screen.innerHTML = h;
    var site = document.getElementById("site");
    site.oninput = function () { state.site = site.value.trim(); save(); document.getElementById("sum").textContent = summaryText(c); };
    document.getElementById("copy").onclick = function () {
      var t = summaryText(c), toast = document.getElementById("toast");
      function ok() { toast.textContent = "Copied. Paste it into a message to INCYT."; }
      function fallback() {
        var sel = window.getSelection(), range = document.createRange();
        range.selectNodeContents(document.getElementById("sum")); sel.removeAllRanges(); sel.addRange(range);
        try { document.execCommand("copy"); ok(); } catch (e) { toast.textContent = "Select the text above and copy it."; }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
    };
    document.getElementById("back").onclick = function () { go(2); };
    document.getElementById("reset").onclick = function () { state = fresh(); save(); go(0); };
  }

  function start(data) {
    if (data && data.step !== undefined) state = data;
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return state; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>

</body>
